[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-vr"
version = "0.1.0"
description = "TRACE: does minimal visual graph repair training transfer to non-edit relational QA?"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pillow>=10.1", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "networkx>=3.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
